<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math-Animated | Login and Registration</title>
</head>
<body>
    <!-- Background Animation -->
    <div class="animatedBg">
        <!-- <div class="multiplication"> -->
            <img class="bgIcon" src="Assets/Image/Symbols/multiplication.png" alt="">
            <img class="bgIcon" src="Assets/Image/Symbols/multiplication_2.png" alt="">
            <img class="bgIcon" src="Assets/Image/Symbols/multiplication_3.png" alt="">
        <!-- </div> -->
        <!-- <div class="addition"> -->
            <img class="bgIcon" src="Assets/Image/Symbols/addition_1.png" alt="">
            <img class="bgIcon" src="Assets/Image/Symbols/addition_2.png" alt="">
            <img class="bgIcon" src="Assets/Image/Symbols/addition_3.png" alt="">
        <!-- </div> -->
        <!-- <div class="division"> -->
            <img class="bgIcon" src="Assets/Image/Symbols/division1.png" alt="">
            <img class="bgIcon" src="Assets/Image/Symbols/division2.png" alt="">
            <img class="bgIcon" src="Assets/Image/Symbols/division3.png" alt="">
        <!-- </div> -->
    </div>
    <!-- Navigation -->
    <header id="header" class="header">
            <h2 class="appName">Math Calculator</h2>
            <nav class="navigation">
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="./about.html">About</a></li>
                    <li><a href="./services.html">Services</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                </ul>
                <div class="nav-button">
                    <button  id="btnSignIn" class="btnLogin-popup" onclick="SignIn()">Login</button>
                    <button  id="btnStartGame"  onclick="StartGame()">Start</button>
                </div>
            </nav>
    </header>
    <!-- Main Window Operations -->
    <main class="player-app">
        <!-- Login Form -->
        <section id="loginPage" class="sign-wrapper"> 
            <span class="icon-close" onclick="IconClose()">
                <i class="bx bx-x"></i>
            </span>

            <div class="form-box login">
                <h2>Login</h2>
                <form id="login" onsubmit="UserLogin(event)" method="post">
                    <fieldset>
                        <legend>Player Info</legend>
                        <span class="icon"><i class='bx bx-user-circle'></i></span>
                        <div class="input">
                            <input type="text" id="username" minlength="3" required>
                            <label id="username_Label">Username</label>
                        </div>

                        <div class="input">
                            <input type="password" id="loginKey" minlength="5" required>
                            <span class="icon-pass"><i id="toggleIcon" class='bx bx-show' onclick="ShowPass('loginKey', 'toggleIcon')"></i></span>
                            <label id="password_Label">Password</label>
                        </div>
                    </fieldset>
                    <br>
                    <div class="remember-forget">
                        <label><input type="checkbox">Remember me</label>
                        <a href="#" style="position: relative; right: 20px;top: 5px;">Forget Password?</a>
                    </div>
                    <input type="submit" id = "loginBtn" class="btn" value="Login" disabled>
                    <div class="login-register">
                        <p>Don't have an account?
                            <a href="#" class="register-link" onclick="RegisterPage()">Register</a>
                        </p>
                    </div>
                </form>
            </div>
        </section>

        <!-- Register Form -->
        <section id="registerPage" class="sign-wrapper"> 
            <span class="icon-close" onclick="IconClose()">
                <i class="bx bx-x"></i>
            </span>
            <div class="form-box register">
                <h2>Registration</h2>
                <form id="register" onsubmit="Register(event)" method="post">
                    
                    <fieldset>
                        <legend>Player Info</legend>
                        <span class="icon"><i class='bx bx-user-circle'></i></span>

                        <div class="input">
                            <input type="text" id="firstName" minlength="3" required>
                            <label id="firstName_Label">First Name</label>
                        </div>

                        <div class="input">
                            <input type="text" id="lastName" minlength="3" required>
                            <label id = "lastName_Label">Last Name</label>
                        </div>

                        <div class="input">
                            <input type="email" id="email" onblur="ValidateEmail()" required pattern="^[a-zA-Z0-9._\-]+@gmail\.com$">
                            <label id = "email_Label">Email</label>
                        </div>

                        <div class="input">
                            <input id="DOB" type="date" onblur="ValidateDOB()" required>  
                            
                            <label id="DOB_Label">Date Of Birth</label>
                        </div>

                        <div class="input">
                            <input type="number" id="age" min="9" max="12" readonly required placeholder=" ">
                            <label id="age_Label">Age</label>
                        </div>

                        <div class="genderType">
                            <h3>Gender</h3> 
                                <input type="radio" name="Gender" id="gender1" value="Male" required>
                                <label for="gender1">Male</label>
                                <br>
                                <input type="radio" name="Gender" id="gender2" value="Female" required>
                                <label for="gender2">Female</label>
                        </div>
                         <div class="input">
                            <input type="text" id="username2" minlength="3" required>
                            <label id="username_Label2">Username</label>
                        </div>
                        <div class="input">
                            <input type="password" id="registerKey" minlength="5" required>
                            <span class="icon-pass"><i id="toggleIcon2" class='bx bx-show' onclick="ShowPass('registerKey', 'toggleIcon2')"></i></span>
                            <label id="password_Label2">Password</label>
                        </div>
                    </fieldset>
                    <br>
                    <div class="remember-forget">
                        <label><input type="checkbox">  I agree to the terms and conditions</label>
                    </div>
                    <input type="submit" id="registerBtn" class="btn" value="Register" disabled>
                    <div class="login-register">
                        <p>Already have an account?
                            <a href="#" class="register-link" onclick="LoginPage()">Login</a>
                        </p>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <!-- Gameplay  Operations-->
    <div id="progressArea">
        <div id="progressWrapper">
            <h3><span id="userTag"></span></h3>
        </div>
    </div>
    <section id = "gameArea" >
        <div id="game-card">
            <div class="question-row">
                <img id="img1" class="numImg" src="Assets/Image/Numbers/Image1.jpg"alt="Digit1"> <!--First digit-->
                <img id="multiSymb" class="symbol" src="Assets/Image/Symbols/multiplicationSymbol.jpg" alt="Mathematical Sign"> <!--Mathematical Sign-->
                <img id="img2" class="numImg" src="Assets/Image/Numbers/Image1.jpg" alt="Digit2"> <!--Second digit-->
                <img id="equSymb" class="symbol" src="Assets/Image/Symbols/equalSymbol.jpg" alt="Mathematical Sign">
                <div id="answer-row">
                    <img id="ansD1" class="numImg" src="Assets/Image/Numbers/Image0.jpg" alt="AnswerDigit1">
                    <img id="ansD2" class="numImg" src="Assets/Image/Numbers/Image2.jpg"alt="AnswerDigit2">
                </div>
            </div>
            <div class="input-row">
                <input id="answerBox" type="number" placeholder = "Enter your answer">
                <button id="checkAnswer" onclick="CheckAnswer()">CheckAnswer</button>
            </div>
            <!-- Gameplay Controls -->
            <div class="controls">
                <button id="nextBtn" class="playButton" onclick="PlayGame()">Next</button>
                <button id="endGameBtn" class="playButton" onclick="EndGame()">End</button>
                <button id="findPercentBtn" class="playButton"onclick="CalculatePercentageScore()">View Stats</button>
            </div>
        </div>
    </section>
    <!-- Display Charts -->
    <section id="dashboard">
        <div id="showPercentageRow" class="card"></div>
        <div id="showAllPlayers" class="card"></div>
        <div id="charts">
            <div id="genderChart" class="chart-card"></div>
            <div id="percentChart" class="chart-card"></div>
            <div id="mostRecentPercentChart" class="chart-card"></div>
        </div>
    </section>
    <a href="#header">
        <button type="button" class="topBtn">
            <span>Top</span>
            <img src="Assets/Image/Top.png" alt="topBtn">
        </button>
    </a>
</body>
<script src="Math-Animated.js"></script>
<script>
    function sanitizeUrl() {
        const url = new URL(window.location.href), params = url.searchParams, action = params.get("action")//Clears hash from url. , ;
        let newPath = url.pathname;

        if (action === "login") {SignIn();}//Redirects to 
        if (action === "register"){RegisterPage();}
        if (action === "play"){ StartGame();}

        if (newPath.endsWith("index.html")) {
            newPath = newPath.replace("index.html", "");//Clears index pathname from url.
        }

        if (action) {
            params.delete("action");//Used to clear action after its operation.
        }

        const cleanedUrl = newPath +  (params.toString() ? "?" + params.toString(): "");

        if (window.location.href !== window.location.origin + cleanedUrl ) {
            window.history.replaceState({}, document.title, cleanedUrl);//Used to replace url after its sanitation.
        }
    }

    window.addEventListener("load", sanitizeUrl);//Fires on page load
    window.addEventListener("hashchange", sanitizeUrl);//Fires on url hash change.
    window.addEventListener("popstate", sanitizeUrl);//Fires on page  navigation interaction.

</script>
